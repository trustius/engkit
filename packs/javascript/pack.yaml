schema_version: 1
kind: pack
id: javascript
version: 1.0.0
description: Representative pack for JavaScript packages (package.json, lockfile-based package-manager evidence).
profile_schema: {min: 1, max: 1}
applies_to:
  stack: [javascript, node, npm, pnpm, yarn]
detect:
  - files: [package.json]
    component: true
    parse: json
    stack: {languages: [javascript], runtimes: [node]}
  - files: [package.json]
    parse: json
    key: scripts.test
    commands:
      test: {argv: ["{package_manager}", run, test], status: documented}
  - files: [package.json]
    parse: json
    key: scripts.build
    commands:
      build: {argv: ["{package_manager}", run, build], status: documented}
  - files: [package-lock.json]
    stack: {package_managers: [npm]}
  - files: [pnpm-lock.yaml]
    stack: {package_managers: [pnpm]}
  - files: [yarn.lock]
    stack: {package_managers: [yarn]}
references: [references/package-managers.md]
fragments: [fragments/component.md]
