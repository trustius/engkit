schema_version: 1
kind: pack
id: rust
version: 1.0.0
description: Representative pack for Rust crates and workspaces (detection by Cargo.toml).
profile_schema: {min: 1, max: 1}
applies_to:
  stack: [rust, cargo]
detect:
  - files: [Cargo.toml]
    component: true
    stack: {languages: [rust], build_tools: [cargo], package_managers: [cargo]}
    commands:
      test: {argv: [cargo, test], status: inferred}
      build: {argv: [cargo, build], status: inferred}
references: [references/testing.md]
fragments: [fragments/component.md]
