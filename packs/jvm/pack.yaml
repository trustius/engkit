schema_version: 1
kind: pack
id: jvm
version: 1.0.0
description: Representative pack for JVM services built with Maven or Gradle.
profile_schema: {min: 1, max: 1}
applies_to:
  stack: [java, kotlin, jvm, maven, gradle]
detect:
  - files: [pom.xml]
    component: true
    stack: {languages: [java], runtimes: [jvm], build_tools: [maven]}
    commands:
      test: {argv: [mvn, test], status: inferred}
  - files: [build.gradle, build.gradle.kts]
    component: true
    stack: {runtimes: [jvm], build_tools: [gradle]}
  - files: [gradlew]
    commands:
      test: {argv: [./gradlew, test], status: inferred}
references: [references/build-tools.md]
fragments: [fragments/component.md]
