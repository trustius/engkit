schema_version: 1
kind: pack
id: go
version: 1.0.0
description: Representative pack for Go modules (detection by go.mod; testing conventions).
profile_schema: {min: 1, max: 1}
applies_to:
  stack: [go]
detect:
  - files: [go.mod]
    component: true
    stack: {languages: [go], build_tools: [go]}
    commands:
      test: {argv: [go, test, ./...], status: inferred}
      build: {argv: [go, build, ./...], status: inferred}
references: [references/testing.md]
fragments: [fragments/component.md]
