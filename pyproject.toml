[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engkit"
dynamic = ["version"]
description = "Portable engineering-workflow skills and a small CLI to install them for Claude Code and Codex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "trustius" }]
keywords = ["claude-code", "codex", "agent-skills", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "build==1.6.1", "twine==7.0.0"]

[project.urls]
Homepage = "https://github.com/trustius/engkit"
Issues = "https://github.com/trustius/engkit/issues"
Changelog = "https://github.com/trustius/engkit/blob/main/CHANGELOG.md"

[project.scripts]
engkit = "engkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["engkit", "engkit.skills"]

[tool.setuptools.package-data]
engkit = ["skills/**/*"]

[tool.setuptools.dynamic]
version = { attr = "engkit.__version__" }

[tool.pytest.ini_options]
# Never collect eval fixtures: they are inert synthetic data, not tests.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
